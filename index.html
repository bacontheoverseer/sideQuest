<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SideQuest // Build in Public</title>
  <style>
    :root {
      --bg-dark: #0f141c;
      --bg-card: #161f30;
      --cyber-green: #00ff87;
      --cyber-blue: #00d2ff;
      --kawaii-pink: #ff007f;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace; /* Lo-fi terminal feel */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      padding: 20px;
    }

    /* Left Sidebar */
    sidebar {
      border-right: 1px solid #22314d;
      padding-right: 20px;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--cyber-blue);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    .logo span { color: var(--kawaii-pink); }

    .nav-item {
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 5px;
      transition: 0.2s;
    }
    .nav-item:hover { background: var(--bg-card); color: var(--cyber-green); }

    /* Main Feed Area */
    main {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Log Update Input Box */
    .log-box {
      background: var(--bg-card);
      border: 1px solid #22314d;
      border-radius: 12px;
      padding: 20px;
    }
    
    textarea {
      width: 100%;
      background: #0b1017;
      border: 1px solid #22314d;
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      resize: none;
      box-sizing: border-box;
      font-family: inherit;
    }

    .log-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    button {
      background: var(--kawaii-pink);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }

    /* Feed Post Cards */
    .post-card {
      background: var(--bg-card);
      border: 1px solid #22314d;
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .quest-title {
      color: var(--cyber-green);
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .category-tag {
      font-size: 0.75rem;
      background: #22314d;
      padding: 3px 8px;
      border-radius: 4px;
      color: var(--cyber-blue);
    }

    .post-content {
      line-height: 1.5;
    }

    .post-footer {
      margin-top: 15px;
      display: flex;
      gap: 15px;
    }

    .action-btn {
      background: none;
      border: 1px solid #22314d;
      color: var(--text-muted);
      padding: 5px 10px;
      font-size: 0.8rem;
    }
    .action-btn:hover {
      border-color: var(--kawaii-pink);
      color: var(--kawaii-pink);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Controls -->
    <sidebar>
      <div class="logo">Side<span>Quest</span></div>
      <div class="nav-item">🌌 All Quests</div>
      <div class="nav-item">💻 Software Apps</div>
      <div class="nav-item">🛠️ Life Hacks</div>
      <div class="nav-item">🦾 Hardware</div>
    </sidebar>

    <!-- Main Content Stream -->
    <main>
      <!-- Log New Quest Entry Box -->
      <div class="log-box">
        <textarea rows="3" placeholder="Log your latest progress... (e.g. Optimized the proxy background loop!)"></textarea>
        <div class="log-actions">
          <span style="color: var(--text-muted); font-size: 0.8rem;">Quest: Sunshine Proxy</span>
          <button>Transmit Log</button>
        </div>
      </div>

      <!-- Feed Stream Container -->
      <div id="feed">
        <!-- Mock Post Structure -->
        <div class="post-card">
          <div class="post-header">
            <div>
              <span style="font-weight: bold;">@cyber_builder</span> 
              <span style="color: var(--text-muted)">logged on</span> 
              <span class="quest-title">Cytrus Soda Brand</span>
            </div>
            <span class="category-tag">life-hack</span>
          </div>
          <div class="post-content">
            Day 14: Finished dialing in the orange-mint carbonation profile. Added a cold-brew infusion step to lock in the mint aroma. Tastes completely fresh.
          </div>
          <div class="post-footer">
            <button class="action-btn">✨ Enhance (12)</button>
            <button class="action-btn">💬 Advise</button>
          </div>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
