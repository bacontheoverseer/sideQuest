<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SideQuest // Feed</title>
  <style>
    :root {
      --bg-black: #000000;
      --bg-dark: #0b0f17;
      --cyber-green: #00ff87;
      --cyber-blue: #00d2ff;
      --kawaii-pink: #ff007f;
      --text-white: #ffffff;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    /* TikTok Style Snap Container */
    .video-feed {
      width: 100%;
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory; /* Forces full screen snapping */
      scroll-behavior: smooth;
    }

    /* Individual Full Screen Video Slide */
    .video-slide {
      width: 100%;
      height: 100vh;
      scroll-snap-align: start; /* Locks slide to top edge */
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-dark);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Fills screen like TikTok mobile view */
      max-width: 500px; /* Constraints for desktop browser testing */
    }

    /* UI Overlay Left side: Text descriptions */
    .video-sidebar-left {
      position: absolute;
      bottom: 30px;
      left: calc(50% - 230px);
      width: 360px;
      z-index: 10;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
      padding: 0 20px;
    }

    @media (max-width: 520px) {
      .video-sidebar-left { left: 20px; width: auto; right: 80px; }
    }

    .username {
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--cyber-blue);
      margin-bottom: 5px;
    }

    .quest-tag {
      color: var(--cyber-green);
      font-size: 0.9rem;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 8px;
    }

    .caption {
      font-size: 0.9rem;
      line-height: 1.4;
    }

    /* UI Overlay Right side: Action Utility Buttons */
    .video-sidebar-right {
      position: absolute;
      bottom: 100px;
      right: calc(50% - 240px);
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
      align-items: center;
    }

    @media (max-width: 520px) {
      .video-sidebar-right { right: 15px; }
    }

    .action-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(22, 31, 48, 0.6);
      border: 1px solid rgba(0, 210, 255, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 1.2rem;
      transition: 0.2s;
    }

    .action-circle:hover {
      transform: scale(1.1);
      border-color: var(--kawaii-pink);
    }

    .action-label {
      font-size: 0.7rem;
      color: #cbd5e1;
      margin-top: 4px;
      text-align: center;
    }

    .action-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* App Header Logo overlay */
    .app-header {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 10;
      font-size: 1.3rem;
      letter-spacing: 3px;
      font-weight: bold;
      text-transform: uppercase;
      color: var(--cyber-blue);
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .app-header span { color: var(--kawaii-pink); }
  </style>
</head>
<body>

  <div class="app-header">Side<span>Quest</span></div>

  <!-- The Snapping Container -->
  <div class="video-feed" id="feed">
    
    <!-- Hardcoded Mock Slide to see what it looks like before DB rows exist -->
    <div class="video-slide">
      <!-- Direct placeholder sample video loop -->
      <video src="https://assets.mixkit.co/videos/preview/mixkit-typing-on-a-backlit-keyboard-in-the-dark-43187-large.mp4" loop autoplay muted playsinline></video>
      
      <div class="video-sidebar-left">
        <div class="username">@cyber_builder</div>
        <div class="quest-tag">⚙️ Sunshine Proxy</div>
        <div class="caption">Wired up the background fetch worker loop! Everything is streaming in under 40ms now. Let's go! #lofi #cyber</div>
      </div>

      <div class="video-sidebar-right">
        <div class="action-group">
          <div class="action-circle">✨</div>
          <div class="action-label">128</div>
        </div>
        <div class="action-group">
          <div class="action-circle">💬</div>
          <div class="action-label">8</div>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = 'https://pxkfgrtxtyydaylnducd.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_WF-pMH4Z_cSZtz2oUlBEoA_kx1hnSMc'
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    async function streamVideoFeed() {
      const { data: logs, error } = await supabase
        .from('updates')
        .select(`
          id, content, video_url,
          projects ( title, category ),
          profiles ( username )
        `)
        .order('created_at', { ascending: false })

      if (error) {
        console.error("Database connection dropped:", error)
        return;
      }

      const feedElement = document.getElementById('feed');
      if (logs && logs.length > 0) {
        feedElement.innerHTML = ''; // Wipe mock content if data exists

        logs.forEach(log => {
          const slide = document.createElement('div');
          slide.className = 'video-slide';

          slide.innerHTML = `
            <video src="${log.video_url}" loop autoplay muted playsinline></video>
            <div class="video-sidebar-left">
              <div class="username">@${log.profiles?.username || 'builder'}</div>
              <div class="quest-tag">🚀 ${log.projects?.title || 'SideQuest'}</div>
              <div class="caption">${log.content}</div>
            </div>
            <div class="video-sidebar-right">
              <div class="action-group">
                <div class="action-circle">✨</div>
                <div class="action-label">Enhance</div>
              </div>
              <div class="action-group">
                <div class="action-circle">💬</div>
                <div class="action-label">Advise</div>
              </div>
            </div>
          `;
          feedElement.appendChild(slide);
        });
      }
    }

    streamVideoFeed();
  </script>
</body>
</html>
