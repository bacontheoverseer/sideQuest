<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SideQuest // Feed</title>
  <style>
    :root {
      --insta-bg: #000000;
      --insta-card: #000000;
      --insta-border: #262626;
      --cyber-green: #00ff87;
      --cyber-blue: #00d2ff;
      --kawaii-pink: #ff007f;
      --text-primary: #f5f5f5;
      --text-muted: #a8a8a8;
      --input-bg: #121212;
    }

    body, html {
      margin: 0;
      padding: 0;
      background-color: var(--insta-bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Fixed Top App Bar */
    .nav-bar {
      position: fixed;
      top: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.85);
      border-bottom: 1px solid var(--insta-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      padding: 0 20px;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }
    .logo span { color: var(--kawaii-pink); }

    .config-btn {
      background: none;
      border: 1px solid var(--insta-border);
      color: var(--cyber-blue);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* Main Scrolling Container */
    .feed-container {
      max-width: 470px;
      margin: 80px auto 40px auto;
      padding: 0 10px;
    }

    /* Instagram Styled Post Creator Box */
    .create-card {
      background: var(--insta-card);
      border: 1px solid var(--insta-border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .create-card h4 {
      margin: 0 0 12px 0;
      font-size: 0.9rem;
      color: var(--cyber-blue);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .create-card textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--insta-border);
      color: var(--text-primary);
      border-radius: 6px;
      padding: 10px;
      box-sizing: border-box;
      resize: none;
      font-family: inherit;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .create-card input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--insta-border);
      color: var(--text-primary);
      border-radius: 6px;
      padding: 8px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    .btn-submit {
      background: var(--kawaii-pink);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      width: 100%;
    }

    /* Instagram Styled Post Card */
    .insta-card {
      background: var(--insta-card);
      border: 1px solid var(--insta-border);
      border-radius: 8px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--cyber-blue), var(--kawaii-pink));
      padding: 2px;
    }
    .avatar-inner {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 50%;
    }

    .username {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .quest-tag {
      font-size: 0.75rem;
      color: var(--cyber-green);
      font-family: monospace;
    }

    .media-container {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #050505;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-actions {
      display: flex;
      gap: 16px;
      padding: 12px 12px 6px 12px;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--text-primary);
      cursor: pointer;
      padding: 0;
    }

    .card-body {
      padding: 0 12px 16px 12px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .caption-text span {
      font-weight: 600;
      margin-right: 8px;
    }

    /* Configuration Modal */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }
    .modal.hidden { display: none; }
    .modal-content {
      background: #121212;
      border: 1px solid var(--insta-border);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }
    .modal-content input {
      width: 100%;
      background: #1c1c1e;
      border: 1px solid var(--insta-border);
      color: white;
      padding: 10px;
      margin: 8px 0 16px 0;
      border-radius: 6px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <div class="logo">Side<span>Quest</span></div>
    <button class="config-btn" id="open-config">⚙️ Config Keys</button>
  </div>

  <div class="feed-container">
    
    <!-- Post Creator Form -->
    <div class="create-card">
      <h4>Log a Quest Update</h4>
      <input type="text" id="post-video" placeholder="Paste direct video URL (mp4)...">
      <textarea id="post-caption" rows="2" placeholder="What did you build or hack today?"></textarea>
      <button class="btn-submit" id="submit-log">Transmit to Feed</button>
    </div>

    <!-- Live Stream Target -->
    <div id="feed">
      <!-- Fallback Placeholder Card -->
      <div class="insta-card">
        <div class="card-header"><div class="user-info"><div class="avatar"><div class="avatar-inner"></div></div><span class="username">cyber_builder</span><span class="quest-tag">// sample-quest</span></div></div>
        <div class="media-container">
          <video src="https://assets.mixkit.co/videos/preview/mixkit-typing-on-a-backlit-keyboard-in-the-dark-43187-large.mp4" loop autoplay muted playsinline></video>
        </div>
        <div class="card-body"><div class="caption-text"><span>cyber_builder</span>Configure your Supabase credentials using the button above to view your live cloud stream data!</div></div>
      </div>
    </div>

  </div>

  <!-- Setup Keys Modal Box -->
  <div class="modal hidden" id="config-modal">
    <div class="modal-content">
      <h3 style="margin-top:0; color: var(--cyber-blue);">Supabase Setup</h3>
      <p style="font-size: 0.8rem; color: var(--text-muted);">Saved inside your browser storage container. Safe from public GitHub scrapers.</p>
      
      <label>SUPABASE_URL</label>
      <input type="text" id="secret-url" placeholder="https://xyz.supabase.co">
      
      <label>SUPABASE_ANON_KEY</label>
      <input type="password" id="secret-key" placeholder="eyJhbGciOiJIUzI1Ni...">
      
      <button id="save-secrets" style="width: 100%; padding: 10px; border-radius: 6px; background: var(--kawaii-pink); color: white; border: none; font-weight: bold; cursor: pointer;">Save Locally</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const modal = document.getElementById('config-modal');
    let supabase = null;

    function getKeys() {
      return {
        url: localStorage.getItem('SQ_LOCAL_URL'),
        key: localStorage.getItem('SQ_LOCAL_KEY')
      }
    }

    async function initStream() {
      const keys = getKeys();
      if (!keys.url || !keys.key) {
        modal.classList.remove('hidden');
        return;
      }

      supabase = createClient(keys.url, keys.key);
      loadFeed();
    }

    async function loadFeed() {
      try {
        const { data: logs, error } = await supabase
          .from('updates')
          .select(`content, video_url, projects(title), profiles(username)`)
          .order('created_at', { ascending: false });

        if (error) throw error;

        const feed = document.getElementById('feed');
        if (logs && logs.length > 0) {
          feed.innerHTML = '';
          logs.forEach(log => {
            const card = document.createElement('div');
            card.className = 'insta-card';
            card.innerHTML = `
              <div class="card-header">
                <div class="user-info">
                  <div class="avatar"><div class="avatar-inner"></div></div>
                  <span class="username">${log.profiles?.username || 'builder'}</span>
                  <span class="quest-tag">// ${log.projects?.title || 'quest'}</span>
                </div>
              </div>
              <div class="media-container">
                <video src="${log.video_url}" loop autoplay muted playsinline></video>
              </div>
              <div class="card-actions">
                <button class="icon-btn">✨</button>
                <button class="icon-btn">💬</button>
              </div>
              <div class="card-body">
                <div class="caption-text"><span>${log.profiles?.username || 'builder'}</span>${log.content}</div>
              </div>
            `;
            feed.appendChild(card);
          });
        }
      } catch (err) {
        console.error("Fetch failure:", err.message);
      }
    }

    // Handle Upload Submission
    document.getElementById('submit-log').addEventListener('click', async () => {
      if (!supabase) return alert("Please configure keys first!");
      
      const videoUrl = document.getElementById('post-video').value.trim();
      const caption = document.getElementById('post-caption').value.trim();

      if (!videoUrl || !caption) return alert("Fill out both boxes to transmit!");

      // NOTE: For testing purposes before auth is built, we are assuming a linked 
      // project ID and user ID exist in your rows. Change these to your actual database IDs!
      const { error } = await supabase
        .from('updates')
        .insert([
          { 
            content: caption, 
            video_url: videoUrl,
            project_id: 'PASTE_AN_ID_FROM_YOUR_PROJECTS_TABLE', 
            user_id: 'PASTE_YOUR_USER_ID' 
          }
        ]);

      if (error) {
        alert("Upload Error: " + error.message);
      } else {
        document.getElementById('post-video').value = '';
        document.getElementById('post-caption').value = '';
        loadFeed(); // Refresh stream layout instantly
      }
    });

    // Configuration Event Listeners
    document.getElementById('open-config').addEventListener('click', () => {
      const keys = getKeys();
      document.getElementById('secret-url').value = keys.url || '';
      document.getElementById('secret-key').value = keys.key || '';
      modal.classList.remove('hidden');
    });

    document.getElementById('save-secrets').addEventListener('click', () => {
      localStorage.setItem('SQ_LOCAL_URL', document.getElementById('secret-url').value.trim());
      localStorage.setItem('SQ_LOCAL_KEY', document.getElementById('secret-key').value.trim());
      modal.classList.add('hidden');
      initStream();
    });

    initStream();
  </script>
</body>
</html>
